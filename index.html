let ydk=null, generation=0, loading=false, failed=0;
const arts=new Map();
function parseYdk(raw){const result={main:[],extra:[],side:[]};let section=null;for(const row of raw.replace(/^\uFEFF/,'').split(/\r?\n/)){const v=row.trim().toLowerCase();if(v==='#main')section='main';else if(v==='#extra')section='extra';else if(v==='!side')section='side';else if(section&&/^\d{1,10}$/.test(v))result[section].push(v); }if(!result.main.length)throw Error('File YDK non valido: MAIN DECK assente o vuoto.');if(Object.values(result).some(a=>a.length>100))throw Error('Troppe carte in una sezione.');return result;}
async function loadArt(id){
 const url='https://images.ygoprodeck.com/images/cards/'+Number(id)+'.jpg';
 const small='https://images.ygoprodeck.com/images/cards_small/'+Number(id)+'.jpg';
 const sources=[url,small,'https://wsrv.nl/?url='+encodeURIComponent(url),'https://wsrv.nl/?url='+encodeURIComponent(small)];
 for(const src of sources){try{return await new Promise((resolve,reject)=>{const im=new Image();im.crossOrigin='anonymous';const timer=setTimeout(()=>{im.onload=im.onerror=null;reject(Error('Timeout'));},7000);im.onload=()=>{clearTimeout(timer);resolve(im)};im.onerror=()=>{clearTimeout(timer);reject(Error(src))};im.src=src;});}catch(e){console.warn('Immagine non disponibile',src,e);}}
 throw Error(id);
}
function updateSave(){ $('save').disabled=$('mode').value==='ydk'&&(!ydk||loading||failed>0); }
async function loadDeck(){if(!ydk)return;const token=++generation;loading=true;failed=0;updateSave();$('retry').hidden=true;const ids=[...new Set([...ydk.main,...ydk.side,...($('extra').checked?ydk.extra:[])])];let done=0;let queue=ids.slice();async function worker(){while(queue.length&&token===generation){const id=queue.shift();try{if(!arts.has(id))arts.set(id,await loadArt(id));}catch(e){if(token===generation)failed++;}if(token!==generation)return;done++;$('status').textContent=`Caricamento carte: ${done}/${ids.length}`;draw();}}await Promise.all(Array.from({length:6},worker));if(token!==generation)return;loading=false;$('status').textContent=failed?`${failed} immagini non disponibili. Verifica la connessione o prova a disattivare eventuali blocchi di rete, poi riprova.`:`MAIN ${ydk.main.length} · SIDE ${ydk.side.length} · EXTRA ${ydk.extra.length}`;$('retry').hidden=!failed;updateSave();draw();}
function drawYdk(){if(!ydk){text('IMPORTA FILE YDK',687.076336,747,700,28);return;}const x=318.152672,w=737.847328,top=447,H=599,gap=3,ratio=421/614,header=22,sectionGap=8;const sections=[{name:'MAIN DECK',cards:ydk.main,cols:10,color:'#3265a8'}];if(ydk.side.length)sections.push({name:'SIDE DECK',cards:ydk.side,cols:ydk.side.length,color:'#31836c'});if($('extra').checked&&ydk.extra.length)sections.push({name:'EXTRA DECK',cards:ydk.extra,cols:ydk.extra.length,color:'#ad3185'});for(const a of sections){a.rows=Math.max(1,Math.ceil(a.cards.length/a.cols));a.maxW=(w-(a.cols-1)*gap)/a.cols;}const fixed=sections.length*header+(sections.length-1)*sectionGap+sections.reduce((sum,a)=>sum+(a.rows-1)*gap,0);const natural=sections.reduce((sum,a)=>sum+a.rows*a.maxW/ratio,0);const scale=Math.min(1,(H-fixed)/natural);let y=top+(H-fixed-natural*scale)/2;for(const a of sections){const cw=a.maxW*scale,ch=cw/ratio;text(a.name,x,y+6,w-30,11,true,'#233044','left');text(String(a.cards.length),x+w,y+6,30,11,true,'#233044','right');rect(x,y+14,w,1.5,a.color);a.cards.forEach((id,i)=>{const row=Math.floor(i/a.cols),count=Math.min(a.cols,a.cards.length-row*a.cols),rowW=count*cw+(count-1)*gap;const cx=x+(w-rowW)/2+(i%a.cols)*(cw+gap),cy=y+header+row*(ch+gap);const im=arts.get(id);if(im)ctx.drawImage(im,cx,cy,cw,ch);else{rect(cx,cy,cw,ch,'#aab2bf');text(id,cx+cw/2,cy+ch/2,cw-2,10);}});y+=header+a.rows*ch+(a.rows-1)*gap+sectionGap;}}
